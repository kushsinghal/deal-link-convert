services:
  # Website + API (one Node service)
  - type: web
    name: dealloot
    runtime: node
    region: singapore
    plan: free
    buildCommand: yarn install --frozen-lockfile --production=false && node scripts/build-production.mjs
    startCommand: node scripts/start-production.mjs
    healthCheckPath: /api/public/stats
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: dealloot
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: EXTRAPE_SESSION_SECRET
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: X_AUTH_TOKEN
        sync: false
      - key: X_CT0
        sync: false

  # Optional external scheduler: POST /api/public/cron/fetch with Authorization: Bearer <CRON_SECRET>.
  # Source scans import drafts only. Never put the cron secret in a public URL.
